<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suéteres - ModaEstilo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <h1>ModaEstilo</h1>
            </div>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#productos">Suéteres</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h2>Suéteres para esta Temporada</h2>
            <p>Catálogo de estilos únicos</p>
            <a href="#productos" class="btn">Ver Catálogo</a>
        </div>
        <!-- La imagen de fondo del hero se cambia en styles.css, busca el comentario "IMAGEN DE PORTADA" -->
    </section>

    <section id="productos" class="products">
        <h2>Nuestro Catálogo</h2>

        <!-- Buscador simple: filtra los productos por nombre mientras el cliente escribe -->
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="search-input" placeholder="Buscar suéter...">
        </div>

        <div class="product-grid" id="product-grid"></div>
    </section>

    <!-- ═══════════════════════════════════════════════════════════
         SECCIÓN DE CONTACTO — muestra tu código QR
         El archivo "QR.png" debe estar en la raíz del proyecto,
         junto a index.html (igual que como lo tienes en VS Code).
         ═══════════════════════════════════════════════════════════ -->
    <section id="contacto" class="contact">
        <h2>Contáctanos</h2>
        <p>Escanea el código para escribirnos directo por WhatsApp</p>
        <div class="qr-box">
            <img src="QR.png" alt="Código QR de contacto por WhatsApp">
        </div>
    </section>

    <footer>
        <p>&copy; 2026 ModaEstilo. Todos los derechos reservados.</p>
    </footer>

    <!-- ═══════════════════════════════════════════════════════════
         BOTÓN FLOTANTE DE WHATSAPP
         Cambia el número en el href de abajo por el tuyo, formato:
         https://wa.me/502XXXXXXXX  (502 = código de Guatemala)
         ═══════════════════════════════════════════════════════════ -->
    <a href="https://wa.me/50200000000?text=Hola,%20quiero%20información%20sobre%20sus%20suéteres"
       class="whatsapp-float" target="_blank" rel="noopener">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script src="script.js"></script>
</body>
</html>
